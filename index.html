<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Central — seu dia a dia</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F7F5F0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📑</text></svg>">
<style>
:root{
  --paper:#F7F5F0;
  --surface:#FFFFFF;
  --surface-2:#FBFAF7;
  --ink:#2B2A28;
  --ink-soft:#6E6A5F;
  --ink-faint:#A6A196;
  --line:#E9E4D8;
  --shadow-rgb:43,42,40;
  --accent:#35695C;
  --accent-ink:#FFFFFF;
  --danger:#A8433A;
  --c-tasks:#3B6E8F;
  --c-notes:#7A5C8E;
  --c-expenses:#B8862B;
  --c-habits:#3E7A5D;
  --c-shopping:#8E3B46;
  --c-journal:#4A4E7C;
  --c-contacts:#2E8B7F;
  --c-water:#2E8FB0;
  --tint-1:#F1ECDD;
  --tint-2:#F7F5F0;
  --r-sm:10px;
  --r-md:14px;
  --r-lg:18px;
  --r-pill:999px;
  --sp-1:4px;
  --sp-2:8px;
  --sp-3:12px;
  --sp-4:16px;
  --sp-5:20px;
  --sp-6:24px;
  --sp-8:32px;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{ margin:0; padding:0; height:100dvh; background:#E7E3D6; overflow:hidden; }
body{ font-family:var(--font); color:var(--ink); -webkit-font-smoothing:antialiased; overscroll-behavior-y:none; }
button,input,textarea,select{font-family:inherit;}
button{cursor:pointer;margin:0;padding:0;background:none;border:none;color:inherit;font:inherit;}
h1,h2,h3,p{margin:0;}
::selection{background:rgba(53,105,92,.18);}

/* ============================================================
   TEMA ESCURO (DARK MODE) E SEGURANÇA
   ============================================================ */
html.dark-theme, body.dark-theme { background: #0A0A0A; }
body.dark-theme {
  --paper: #141414; --surface: #1E1E1E; --surface-2: #2A2A2A;
  --ink: #F0F0F0; --ink-soft: #A8A8A8; --ink-faint: #666666;
  --line: #333333; --shadow-rgb: 0, 0, 0;
  --tint-1: #1E1E1E !important; --tint-2: #141414 !important;
}
body.dark-theme #app { box-shadow: 0 0 60px rgba(0,0,0,0.5); }

/* Esconde botões do módulo quando travado */
.module-screen.is-locked .module-body > *:not(.list) { display: none !important; }
.module-screen.is-locked .filter-tabs { display: none !important; }
.module-screen.is-locked .fab { display: none !important; }
.module-screen.is-locked .header-action:not(.lock-btn) { display: none !important; }

/* ══ LAZY LOADING VIRTUAL ══ */
.item, .gal-item { transition: opacity 0.3s ease, transform 0.12s ease, box-shadow 0.12s ease; }
.lazy-card.lazy-hidden { opacity: 0; pointer-events: none; }

#app{ position:relative; max-width:480px; margin:0 auto; height:100%; background:var(--paper); overflow:hidden; box-shadow:0 0 60px rgba(0,0,0,.18); }

.screen{ position:absolute; inset:0; display:flex; flex-direction:column; background:var(--paper); opacity:0; transform:translateX(16px); pointer-events:none; transition:opacity .22s ease, transform .22s ease; padding-bottom:env(safe-area-inset-bottom); }
.screen.active{ opacity:1; transform:translateX(0); pointer-events:auto; z-index:2; }
#screen-home.active{z-index:1;}

/* ---------- HOME ---------- */
#screen-home{overflow-y:auto;}
.home-header{ display: flex;gap: 8px; justify-content: center;align-items: baseline; position: sticky; top: 0; z-index: 10; padding: calc(env(safe-area-inset-top) + 5px) var(--sp-5) 5px; background:linear-gradient(180deg, var(--tint-1) 0%, var(--tint-2) 100%); border-bottom:1px solid var(--line); }
.home-header .greet{ font-size:24px; font-weight:700; letter-spacing:-.3px; display:flex; align-items:center; gap:8px; }
.home-header .date{ margin-top:4px; font-size:14px; color:var(--ink-soft); font-weight:500; text-transform:capitalize; }
.stat-row{ display:flex; gap:8px; margin-top:16px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none; }
.stat-row::-webkit-scrollbar{display:none;}
.stat-chip{ flex:0 0 auto; display:flex; align-items:center; gap:6px; background:var(--surface); border:1px solid var(--line); padding:8px 14px; border-radius:var(--r-pill); font-size:13px; font-weight:600; white-space:nowrap; box-shadow:0 1px 2px rgba(var(--shadow-rgb),.04); }
.stat-chip .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;}

.search-wrapper { position: relative; display: flex; align-items: center; margin-top: 16px; }
.search-wrapper input { width: 100%; border: 1.5px solid var(--line); background: var(--surface); border-radius: var(--r-pill); padding: 10px 38px 10px 16px; font-size: 14.5px; outline: none; box-shadow: 0 1px 2px rgba(var(--shadow-rgb),.04); color: var(--ink); }
.search-wrapper input:focus { border-color: var(--accent); }
.clear-search { position: absolute; right: 12px; width: 22px; height: 22px; border-radius: 50%; background: var(--line); color: var(--ink-soft); font-size: 11px; display: flex; align-items: center; justify-content: center; transition: background 0.15s; }
.clear-search:active { background: var(--ink-faint); color: var(--surface); }

.tile-grid{overflow-y: auto; max-height: 67vh; display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:18px var(--sp-5) 28px; }
.tile{ background:var(--surface);align-items: center; border:1px solid var(--line); border-radius:var(--r-lg); padding:16px 14px; text-align:left; display:flex; flex-direction:column; gap:10px; box-shadow:0 1px 3px rgba(var(--shadow-rgb),.05); transition:transform .12s ease, box-shadow .12s ease; }
.tile:active{transform:scale(.96);box-shadow:0 1px 1px rgba(var(--shadow-rgb),.04);}
.tile .bubble{ width:38px;height:38px; border-radius:12px; display:flex;align-items:center;justify-content:center; font-size:18px; }
.tile .t-title{font-size:14.5px;font-weight:700;letter-spacing:-.1px;}
.tile .t-sub{font-size:12.5px;color:var(--ink-soft);font-weight:500;font-variant-numeric:tabular-nums;}
.hint-footer{ text-align:center; font-size:12px; color:var(--ink-faint); padding:0 var(--sp-6) 24px; line-height:1.5; }

/* ---------- MODULE SCREENS ---------- */
.module-screen{background:var(--surface-2);}
.module-header{ padding:calc(env(safe-area-inset-top) + 14px) var(--sp-4) 16px; display:flex; align-items:center; gap:10px; color:#fff; flex:0 0 auto; }
.module-header h2{font-size:19px;font-weight:700;letter-spacing:-.2px;flex:1;}
.back-btn, .header-action{ width:34px;height:34px; border-radius:50%; border:none; background:rgba(255,255,255,.22); color:#fff; font-size:18px; display:flex;align-items:center;justify-content:center; flex:0 0 auto; }
.back-btn:active{background:rgba(255,255,255,.34);}

.filter-tabs{justify-content: center; display:flex; gap:8px; padding: 10px 23px 20px 23px; flex:0 0 auto; overflow-x:auto; scrollbar-width:none; }
.filter-tabs::-webkit-scrollbar{display:none;}
.f-tab{ flex:0 0 auto; padding:7px 14px; border-radius:var(--r-pill); border:none; background:rgba(255,255,255,.22); color:#fff; font-size:12.5px; font-weight:600; opacity:.75; }
.f-tab.active{background:#fff;color: #141414;opacity:1;font-weight: 700;}

.module-body{ flex:1; overflow-y:auto; padding:16px var(--sp-4) 80px; background:var(--surface-2); border-top-left-radius:20px; border-top-right-radius:20px; margin-top:-14px; }

.list{display:flex;flex-direction:column;gap:10px;}
.item{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r-md); padding:13px 14px; display:flex; align-items:flex-start; gap:11px; box-shadow:0 1px 2px rgba(var(--shadow-rgb),.04); }
.item .grow{flex:1;min-width:0;}
.item .i-title{font-size:15px;font-weight:600;line-height:1.35;word-break:break-word;}
.item .i-sub{font-size:12.5px;color:var(--ink-soft);margin-top:3px;font-weight:500;}
.item.done .i-title{color:var(--ink-faint);text-decoration:line-through;}
.check{ width:23px;height:23px; border-radius:50%; border:2px solid var(--line); flex:0 0 auto; display:flex;align-items:center;justify-content:center; color:#fff; font-size:13px; margin-top:1px; transition:background .15s, border-color .15s, transform .1s; }
.check.on{transform:scale(1.04);}
.icon-btn{ width:30px;height:30px; border-radius:50%; border:none; background:transparent; color:var(--ink-faint); font-size:15px; flex:0 0 auto; display:flex;align-items:center;justify-content:center; }
.icon-btn:active{background:var(--line);}

.empty-state{ text-align:center; padding:60px 20px; color:var(--ink-faint); }
.empty-state .e-icon{font-size:36px;margin-bottom:10px;}
.empty-state .e-text{font-size:14px;font-weight:600;color:var(--ink-soft);}
.empty-state .e-sub{font-size:12.5px;margin-top:4px;}
.empty-state.compact{padding:22px 10px;}
.empty-state.compact .e-icon{font-size:24px;margin-bottom:6px;}

.fab{ position:absolute; left:20px; bottom:calc(124px + env(safe-area-inset-bottom)); width:56px;height:56px; border-radius:50%; border:none; color:#fff; font-size:26px; font-weight:400; box-shadow:0 6px 16px rgba(var(--shadow-rgb),.28); z-index:5; display:flex;align-items:center;justify-content:center; transition:transform .12s; }
.fab:active{transform:scale(.92);}

/* ---------- SHEET (bottom form) ---------- */
.sheet-overlay{ position:absolute; inset:0; background:rgba(0,0,0,.5); z-index:20; opacity:0; pointer-events:none; transition:opacity .2s ease; display:flex; align-items:flex-end; }
.sheet-overlay.open{opacity:1;pointer-events:auto;}
.sheet{ background:var(--surface); width:100%; max-height:88%; border-top-left-radius:22px; border-top-right-radius:22px; padding:10px var(--sp-5) calc(20px + env(safe-area-inset-bottom)); transform:translateY(100%); transition:transform .26s cubic-bezier(.32,.72,0,1); overflow-y:auto; display:flex; flex-direction:column; gap:14px; }
.sheet-overlay.open .sheet{transform:translateY(0);}
.sheet-grip{width:36px;height:4px;background:var(--line);border-radius:99px;margin:6px auto 0;}
.sheet h3{font-size:18px;font-weight:700;letter-spacing:-.2px;}
.field{display:flex;flex-direction:column;gap:6px;}
.field label{font-size:12.5px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.3px;}
.field input[type=text], .field input[type=number], .field input[type=date], .field input[type=time], .field input[type=tel], .field input[type=password], .field textarea, .field select{
  border:1.5px solid var(--line); background:var(--surface-2); border-radius:var(--r-sm); padding:11px 12px; font-size:15px; color:var(--ink); width:100%; outline:none;
}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent);}
.field textarea{resize:vertical;min-height:80px;line-height:1.45;}
.seg{display:flex;gap:8px;}
.seg button{ flex:1; padding:10px; border-radius:var(--r-sm); border:1.5px solid var(--line); background:var(--surface-2); font-size:13.5px; font-weight:700; color:var(--ink-soft); }
.seg button.active{border-color:var(--accent);color:var(--accent);background:rgba(53,105,92,.08);}
.chip-picker{display:flex;flex-wrap:wrap;gap:8px;}
.chip-picker button{ padding:8px 13px; border-radius:var(--r-pill); border:1.5px solid var(--line); background:var(--surface-2); font-size:13px; font-weight:600; color:var(--ink-soft); }
.chip-picker button.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.emoji-picker{display:flex;justify-content:space-between;}
.emoji-picker button{ width:44px;height:44px; border-radius:50%; border:1.5px solid var(--line); background:var(--surface-2); font-size:21px; display:flex;align-items:center;justify-content:center; }
.emoji-picker button.active{border-color:var(--accent);background:rgba(53,105,92,.1);transform:scale(1.08);}
.sheet-actions{display:flex;gap:10px;margin-top:4px;}
.btn{ flex:1; padding:14px; border-radius:var(--r-md); border:none; font-size:15px; font-weight:700; }
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:active{opacity:.85;}
.btn-ghost{background:var(--surface-2);color:var(--ink-soft);border:1.5px solid var(--line);}
.btn-danger-text{background:none;border:none;color:var(--danger);font-size:13.5px;font-weight:700;padding:6px 0;text-align:left;}

/* ---------- misc widgets ---------- */
.streak-dots{display:flex;gap:5px;margin-top:8px;}
.streak-dots span{width:8px;height:8px;border-radius:50%;background:var(--line);}
.streak-dots span.on{background:var(--c-habits);}
.progress-ring-wrap{display:flex;align-items:center;justify-content:center;padding:18px 0 6px;}
.money-pos{color:var(--accent);font-variant-numeric:tabular-nums;font-family:var(--mono);}
.money-neg{color:var(--danger);font-variant-numeric:tabular-nums;font-family:var(--mono);}
.cat-dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px;flex:0 0 auto;}
.summary-card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); padding:16px; margin-bottom:14px; box-shadow:0 1px 2px rgba(var(--shadow-rgb),.04); }
.summary-row{display:flex;justify-content:space-between;align-items:center;}
.summary-row + .summary-row{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);}
.month-nav{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:12px;}
.month-nav button{background:none;border:none;font-size:17px;color:var(--ink-soft);width:30px;height:30px;}
.month-nav span{font-size:13.5px;font-weight:700;text-transform:capitalize;min-width:120px;text-align:center;}

.quick-add-row{display:flex;gap:8px;margin-bottom:14px;}
.quick-add-row input{ flex:1; border:1.5px solid var(--line); background:var(--surface); border-radius:var(--r-pill); padding:11px 16px; font-size:14.5px; outline:none; color: var(--ink);}
.quick-add-row input:focus{border-color:var(--accent);}
.quick-add-row button{ width:44px;height:44px; border-radius:50%; border:none; color:#fff; font-size:20px; flex:0 0 auto; }

.toast{ position:absolute; left:50%; bottom:30px; transform:translate(-50%,20px); background:var(--ink); color:var(--surface); padding:11px 20px; border-radius:var(--r-pill); font-size:13.5px; font-weight:600; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:50; max-width:85%; text-align:center; }
.toast.show{opacity:1;transform:translate(-50%,0);}

#tasks-header,#tasks-fab,.bubble.b-tasks{background:var(--c-tasks);}
#notes-header,#notes-fab,.bubble.b-notes{background:var(--c-notes);}
#expenses-header,#expenses-fab,.bubble.b-expenses{background:var(--c-expenses);}
#habits-header,#habits-fab,.bubble.b-habits{background:var(--c-habits);}
#shopping-header,#shopping-fab,.bubble.b-shopping{background:var(--c-shopping);}
#journal-header,#journal-fab,.bubble.b-journal{background:var(--c-journal);}
#contacts-header,#contacts-fab,.bubble.b-contacts{background:var(--c-contacts);}
#water-header,#water-fab,.bubble.b-water{background:var(--c-water);}
#passwords-header, #passwords-fab, .bubble.b-passwords { background: #505560; }
#gallery-header, #gallery-fab, .bubble.b-gallery { background: #8E543B; }

.check.on.ck-tasks{background:var(--c-tasks);border-color:var(--c-tasks);}
.check.on.ck-shopping{background:var(--c-shopping);border-color:var(--c-shopping);}
.check.on.ck-habits{background:var(--c-habits);border-color:var(--c-habits);}

.gal-item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 1px 2px rgba(var(--shadow-rgb),.04); transition: transform 0.12s ease; }
.gal-item:active { transform: scale(0.96); }
.gal-thumb { width: 100%; height: 160px; object-fit: cover; background: #111; }
.gal-info { padding: 10px; font-size: 13px; font-weight: 600; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* home header botton */
.home-headerbottom {
    position: sticky;
    top: 0;
    z-index: 10;
    padding: calc(env(safe-area-inset-top) + 5px) var(--sp-5) 5px;
    background: linear-gradient(180deg, var(--tint-1) 0%, var(--tint-2) 100%);
    border-bottom: 1px solid var(--line);
}
</style>
</head>
<body>
<div id="app">

<!-- ===== HOME ===== -->
<section id="screen-home" class="screen active">
  
  
  
  <div class="greet home-header"><span id="greet-emoji">👋</span><span id="greet-text">Olá</span><div class="date" id="date-text"></div></div>
  <div id="home-alerts" style="padding: 16px var(--sp-5) 0;"></div>
  <div class="list" id="search-results" style="display: none;min-height: 67.9vh; overflow-y: auto; max-height: 68vh; padding: 25px 15px 25px 15px;"></div>

  <div class="tile-grid" id="tile-grid"></div>
  <div class="home-headerbottom">
    
    
    <div class="stat-row" id="stat-row"></div>
    
    <div class="search-wrapper">
      <input type="text" id="global-search" placeholder="Buscar tarefas, diário, senhas..." oninput="handleGlobalSearch()" onfocus="enterSearchMode()">
      <button class="clear-search" id="clear-search-btn" onclick="clearSearch()" style="display: none;">✕</button>
    </div>
    
    <div class="chip-picker" id="global-search-filters" style="margin-top:12px; display:none; flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; padding-bottom:4px; -webkit-overflow-scrolling:touch;"></div>
  </div>
  <div class="hint-footer">Tudo fica salvo no seu celular, sem internet. ✨</div>
</section>

<!-- ===== TAREFAS ===== -->
<section id="screen-tasks" class="screen module-screen">
  
  <div class="filter-tabs">
    <button class="f-tab active" data-f="pending">Pendentes</button>
    <button class="f-tab" data-f="done">Concluídas</button>
    <button class="f-tab" data-f="all">Todas</button>
  </div>
  <div class="module-body"><div class="list" id="tasks-list"></div></div>
  <button class="fab" id="tasks-fab" onclick="openTaskForm()">+</button>
  <div class="module-header" id="tasks-header">
    <button class="back-btn" onclick="goHome()">←</button>
    <h2>Tarefas</h2>
  </div>
</section>

<!-- ===== NOTAS ===== -->
<section id="screen-notes" class="screen module-screen">
  
  <div class="module-body" style="margin-top:0;padding-top:16px;"><div class="list" id="notes-list"></div></div>
  <button class="fab" id="notes-fab" onclick="openNoteForm()">+</button>
  <div class="module-header" id="notes-header">
    <button class="back-btn" onclick="goHome()">←</button>
    <h2>Notas</h2>
  </div>
</section>

<!-- ===== GASTOS ===== -->
<section id="screen-expenses" class="screen module-screen">
  
  <div class="module-body" style="margin-top:0;padding-top:16px;">
    <div class="month-nav">
      <button onclick="shiftExpMonth(-1)">‹</button>
      <span id="exp-month-label"></span>
      <button onclick="shiftExpMonth(1)">›</button>
    </div>
    <div class="summary-card">
      <div class="summary-row"><span>Entradas</span><span class="money-pos" id="exp-income">R$ 0,00</span></div>
      <div class="summary-row"><span>Saídas</span><span class="money-neg" id="exp-outcome">R$ 0,00</span></div>
      <div class="summary-row"><strong>Saldo</strong><strong id="exp-balance">R$ 0,00</strong></div>
    </div>
    <div class="list" id="expenses-list"></div>
  </div>
  <button class="fab" id="expenses-fab" onclick="openExpenseForm()">+</button>
  <div class="module-header" id="expenses-header">
    <button class="back-btn" onclick="goHome()">←</button>
    <h2>Gastos</h2>
  </div>
</section>

<!-- ===== HÁBITOS ===== -->
<section id="screen-habits" class="screen module-screen">
  
  <div class="module-body" style="margin-top:0;padding-top:16px;"><div class="list" id="habits-list"></div></div>
  <button class="fab" id="habits-fab" onclick="openHabitForm()">+</button>
  <div class="module-header" id="habits-header">
    <button class="back-btn" onclick="goHome()">←</button>
    <h2>Hábitos e Metas</h2>
  </div>
</section>

<!-- ===== COMPRAS ===== -->
<section id="screen-shopping" class="screen module-screen">
  
  <div class="module-body" style="margin-top:0;padding-top:16px;">
    <div class="quick-add-row">
      <input type="text" id="shopping-quick-input" placeholder="Adicionar item…" onkeydown="if(event.key==='Enter')quickAddShopping()">
      <button style="background:var(--c-shopping)" onclick="quickAddShopping()">+</button>
    </div>
    <div class="list" id="shopping-list"></div>
  </div>
  <div class="module-header" id="shopping-header">
    <button class="back-btn" onclick="goHome()">←</button>
    <h2>Lista de compras</h2>
    <button class="header-action" onclick="clearCheckedShopping()" title="Limpar marcados">🧹</button>
  </div>
</section>

<!-- ===== DIÁRIO ===== -->
<section id="screen-journal" class="screen module-screen">
  
  <div class="module-body" style="margin-top:0;padding-top:16px;"><div class="list" id="journal-list"></div></div>
  <button class="fab" id="journal-fab" onclick="openJournalForm()">+</button>
  <div class="module-header" id="journal-header">

<script>
/* ============================================================

  localStorage.setItem('central-theme', isDark ? 'dark' : 'light');

/* ============================================================
   DOM HELPER
   ============================================================ */
function h(tag, attrs, children){
  attrs = attrs || {}; const el = document.createElement(tag);
  for(const k in attrs){
    const v = attrs[k]; if(v===undefined || v===null) continue;
    if(k==='class') el.className = v;
    else if(k.indexOf('on')===0 && typeof v==='function') el.addEventListener(k.slice(2), v);
    else if(k==='value'){ el.value = v; }
    else el.setAttribute(k, v);
  }
  (Array.isArray(children)?children:children!==undefined?[children]:[]).forEach(c=>{
    if(c===null||c===undefined) return;
    if(typeof c==='string'||typeof c==='number') el.appendChild(document.createTextNode(c));
    else el.appendChild(c);
  });
  return el;
}
function fieldWrap(label, inputEl){ return h('div',{class:'field'},[h('label',{},label), inputEl]); }
function emptyState(icon,text,sub,compact){
  return h('div',{class:'empty-state'+(compact?' compact':'')},[
    h('div',{class:'e-icon'},icon), h('div',{class:'e-text'},text), h('div',{class:'e-sub'},sub)
  ]);
}
function pad(n){ return String(n).padStart(2,'0'); }
function isoDate(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function todayIso(){ return isoDate(new Date()); }
function brl(n){ return (Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
function humanDateFull(iso){
  if(!iso) return ''; if(iso===todayIso()) return 'Hoje';
  const tmr=new Date(); tmr.setDate(tmr.getDate()+1);
  if(iso===isoDate(tmr)) return 'Amanhã';
  const d=new Date(iso+'T00:00:00'); return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'short'});
}
let toastTimer;
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),1800);
}

/* ============================================================
   INDEXEDDB LAYER (ATUALIZADO PARA V3)
   ============================================================ */
const DB_NAME='centralPessoalDB';
const DB_VERSION=3;
const STORES=['tasks','notes','expenses','habits','habitLogs','shopping','journal','contacts','waterLogs','weight','passwords','gallery'];
let db;
function openDatabase(){
  return new Promise((resolve,reject)=>{
    if(!('indexedDB' in window)){ reject(new Error('sem indexedDB')); return; }
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e)=>{
      const d = e.target.result;
      STORES.forEach(name=>{
        if(!d.objectStoreNames.contains(name)){ d.createObjectStore(name, {keyPath:'id', autoIncrement:true}); }
      });
    };
    req.onblocked = () => {
      toast('Feche outras abas para o app atualizar!');
      reject(new Error('blocked'));
    };
    req.onsuccess = (e)=>{ db=e.target.result; resolve(db); };
    req.onerror = (e)=> reject(e.target.error);
  });
}
function dbAll(store){ return new Promise((resolve,reject)=>{ const req=db.transaction(store,'readonly').objectStore(store).getAll(); req.onsuccess=()=>resolve(req.result||[]); req.onerror=()=>reject(req.error); }); }
function dbAdd(store,obj){ return new Promise((resolve,reject)=>{ const req=db.transaction(store,'readwrite').objectStore(store).add(obj); req.onsuccess=()=>{ obj.id=req.result; resolve(req.result); }; req.onerror=()=>reject(req.error); }); }
function dbPut(store,obj){ return new Promise((resolve,reject)=>{ const req=db.transaction(store,'readwrite').objectStore(store).put(obj); req.onsuccess=()=>resolve(req.result); req.onerror=()=>reject(req.error); }); }
function dbDel(store,id){ return new Promise((resolve,reject)=>{ const req=db.transaction(store,'readwrite').objectStore(store).delete(id); req.onsuccess=()=>resolve(); req.onerror=()=>reject(req.error); }); }
async function confirmDelete(store, id, after){ if(!confirm('Excluir este item?')) return; await dbDel(store, id); toast('Excluído'); if(after) await after(); }

function buildCategoryFilter(containerId, defaultCats, items, currentFilter, onChange) {
  const dbCats = items.map(i => i.category).filter(Boolean);

    list.parentNode.insertBefore(box, list);
  }
  box.innerHTML = '';
  ['Todos'].concat(allCats).forEach(c => { box.appendChild(h('button', { type: 'button', class: currentFilter === c ? 'active' : '', style: 'flex: 0 0 auto;', onclick: () => onChange(c) }, c)); });
}

function buildFormCategoryField(defaultCats, initialValue) {
   const wrap = h('div', {class: 'field', style: 'display:flex; flex-direction:column; gap:8px;'});
   let currentVal = initialValue || defaultCats[0];
   const isDefault = defaultCats.includes(currentVal);
   const chips = h('div', {class: 'chip-picker'});
   defaultCats.forEach(c => {
      chips.appendChild(h('button', {
         type: 'button', class: (isDefault && currentVal === c) ? 'active' : '',
         onclick: (e) => { chips.querySelectorAll('button').forEach(b => b.classList.remove('active')); e.currentTarget.classList.add('active'); const inp = document.getElementById('f-cat-input'); inp.value = ''; inp.dataset.val = c; }
      }, c));
   });
   const input = h('input', { type: 'text', id: 'f-cat-input', placeholder: 'Ou digite uma nova categoria...', value: isDefault ? '' : currentVal, 'data-val': currentVal });
   input.oninput = (e) => {
      const val = e.target.value.trim();
      if (val !== '') { chips.querySelectorAll('button').forEach(b => b.classList.remove('active')); e.target.dataset.val = val; } 
      else { const first = chips.querySelector('button'); if(first) { first.classList.add('active'); e.target.dataset.val = first.textContent; } }
   };
   wrap.appendChild(chips); wrap.appendChild(input); return wrap;
}

function setSub(key, text){ const n=document.getElementById('sub-'+key); if(n) n.textContent=text; }

async function updateHomeStats(){
  const [tasks, notes, expenses, habits, habitLogs, shopping, journal, contacts, waterLogs] = await Promise.all(
    ['tasks','notes','expenses','habits','habitLogs','shopping','journal','contacts','waterLogs'].map(dbAll)
  );
  
  const pending = tasks.filter(t=>!t.done && !t.isEncrypted);
  setSub('tasks', pending.length? pending.length+' pendente'+(pending.length>1?'s':'') : 'Tudo em dia 🎉');
  setSub('notes', notes.length? notes.length+' nota'+(notes.length>1?'s':'') : 'Nenhuma nota ainda');

  const now=new Date(); const ym=now.getFullYear()+'-'+pad(now.getMonth()+1);
  const monthExp=expenses.filter(e=>e.date && e.date.indexOf(ym)===0 && !e.isEncrypted);
  const income=monthExp.filter(e=>e.type==='receita').reduce((s,e)=>s+Number(e.amount),0);
  const outcome=monthExp.filter(e=>e.type==='despesa').reduce((s,e)=>s+Number(e.amount),0);
  setSub('expenses', monthExp.length? brl(income-outcome)+' saldo' : 'Nada este mês');

  const todayISO=todayIso();
  const doneToday=new Set(habitLogs.filter(l=>l.date===todayISO).map(l=>l.habitId));
  setSub('habits', habits.length? doneToday.size+'/'+habits.length+' hoje' : 'Crie o 1º hábito');

  const pendingShop=shopping.filter(s=>!s.checked && !s.isEncrypted);
  setSub('shopping', shopping.length? pendingShop.length+' item'+(pendingShop.length!==1?'s':'') : 'Lista vazia');
  setSub('journal', journal.length? journal.length+' registro'+(journal.length>1?'s':'') : 'Nada escrito ainda');
  setSub('contacts', contacts.length? contacts.length+' salvo'+(contacts.length>1?'s':'') : 'Nenhum salvo');
  
  const wToday=waterLogs.find(w=>w.date===todayISO); const wCount=wToday?wToday.count:0; setSub('water', wCount+'/8 copos');
  buildStatChips(pending.length, income-outcome, wCount);

  // Alertas
  const alertsBox = document.getElementById('home-alerts'); alertsBox.innerHTML = ''; 
  const urgentTasks = tasks.filter(t => !t.done && t.due && t.due <= todayISO && !t.isEncrypted);
  if (urgentTasks.length > 0) {
    const banner = h('div', { style: 'background: rgba(168,67,58,0.08); border-left: 4px solid var(--danger); padding: 14px 16px; border-radius: 10px; display: flex; align-items: center; gap: 12px; cursor: pointer;', onclick: () => openModule('tasks') });
    banner.appendChild(h('div', {style: 'font-size: 20px; flex: 0 0 auto; animation: pulse 2s infinite;'}, '🔔'));
    const textWrap = h('div', {style: 'flex: 1;'});
    textWrap.appendChild(h('div', {style: 'color: var(--danger); font-weight: 700; font-size: 14px;'}, 'Atenção aos prazos!'));
    textWrap.appendChild(h('div', {style: 'color: var(--ink-soft); font-size: 13px; margin-top: 2px;'}, `Você tem ${urgentTasks.length} tarefa(s) vencendo hoje.`));
    banner.appendChild(textWrap); alertsBox.appendChild(banner);
    if (!document.getElementById('pulse-style')) document.head.appendChild(h('style', {id: 'pulse-style'}, '@keyframes pulse { 0% {transform: scale(1);} 50% {transform: scale(1.15);} 100% {transform: scale(1);} }'));
  }

  if (typeof isSearchMode !== 'undefined' && isSearchMode) { handleGlobalSearch(); }
}

  row.appendChild(h('button',{class:'stat-chip', onclick:()=>openModule('tasks')},[ h('span',{class:'dot', style:'background:var(--c-tasks)'}), pendingCount+' tarefa'+(pendingCount!==1?'s':'') ]));

let globalSearchFilter = 'Todos'; let isSearchMode = false;
function enterSearchMode() { isSearchMode = true; handleGlobalSearch(); }

  cats.forEach(c => { container.appendChild(h('button', { type: 'button', class: globalSearchFilter === c ? 'active' : '', style: 'flex: 0 0 auto;', onclick: () => { globalSearchFilter = c; handleGlobalSearch(); } }, c)); });

async function handleGlobalSearch() {
  const input = document.getElementById('global-search'); const q = input.value.toLowerCase().trim();
  const grid = document.getElementById('tile-grid'); const resBox = document.getElementById('search-results');
  const hint = document.querySelector('.hint-footer'); const clearBtn = document.getElementById('clear-search-btn');

  if (!isSearchMode && !q) { grid.style.display = 'grid'; hint.style.display = 'block'; resBox.style.display = 'none'; resBox.innerHTML = ''; clearBtn.style.display = 'none'; document.getElementById('global-search-filters').style.display = 'none'; return; }
  clearBtn.style.display = 'flex'; grid.style.display = 'none'; hint.style.display = 'none'; resBox.style.display = 'flex'; resBox.innerHTML = ''; renderGlobalSearchChips();

  const [tasks, notes, contacts, expenses, shopping, journal, habits, habitLogs, passwords, gallery] = await Promise.all([ dbAll('tasks'), dbAll('notes'), dbAll('contacts'), dbAll('expenses'), dbAll('shopping'), dbAll('journal'), dbAll('habits'), dbAll('habitLogs'), dbAll('passwords'), dbAll('gallery') ]);
  let results = []; const todayISO = todayIso(); const now = Date.now();

  if (globalSearchFilter === 'Todos' || globalSearchFilter === 'Tarefas') tasks.forEach(t => { if (!t.isEncrypted && (!q || (t.text || '').toLowerCase().includes(q))) results.push({ type: 'task', item: t, title: t.text, sub: t.done ? 'Concluída' : 'Pendente' }); });
  if (globalSearchFilter === 'Todos' || globalSearchFilter === 'Compras') shopping.forEach(s => { if (!s.isEncrypted && (!q || (s.name || '').toLowerCase().includes(q))) results.push({ type: 'shopping', item: s, title: s.name, sub: 'Lista de compras' }); });
  
  if (globalSearchFilter === 'Todos' || globalSearchFilter === 'Hábitos') {
    habits.forEach(hb => {
      if (!hb.isEncrypted && (!q || (hb.name || '').toLowerCase().includes(q))) {
        const isTimer = hb.type === 'timer'; let checkText = '', extraClass = '', extraStyle = '', sub = '', hasTimer = false, action = null;
        if (isTimer) {
          const target = hb.target || 0; const currentStep = hb.currentStep || 0; const isWaiting = (hb.readyAt && hb.readyAt > now); const isDone = target > 0 && currentStep >= target;

      const pwdInput = h('input',{type:'password', id:'f-pwd-pass', style:'flex:1', value:(existing&&existing.password)||''});

      const genBtn = h('button', { type:'button', class:'btn btn-ghost', style:'flex:0 0 auto; padding:11px 14px; font-size:16px;', onclick: () => { const chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%&*"; let pwd = ""; for(let i=0; i<16; i++) pwd += chars.charAt(Math.floor(Math.random() * chars.length)); document.getElementById('f-pwd-pass').value = pwd; } }, '🎲'); 
      const pwdWrap = h('div', {style:'display:flex; gap:8px;'}); pwdWrap.appendChild(pwdInput); pwdWrap.appendChild(copyPwdBtn); pwdWrap.appendChild(genBtn); box.appendChild(fieldWrap('Senha', pwdWrap));
      box.appendChild(fieldWrap('URL (opcional)', h('input',{type:'text', id:'f-pwd-url', placeholder:'Ex: google.com', value:(existing&&existing.url)||''}))); const ta = h('textarea',{id:'f-pwd-notes'}); ta.value = (existing&&existing.notes)||''; box.appendChild(fieldWrap('Notas', ta));
    },
    onSubmit: async () => {
      const title = document.getElementById('f-pwd-title').value.trim(); const pwd = document.getElementById('f-pwd-pass').value.trim(); if(!title || !pwd){ toast('Título e Senha são obrigatórios'); return false; }
      let rawUrl = document.getElementById('f-pwd-url').value.trim(); if(rawUrl && !rawUrl.startsWith('http://') && !rawUrl.startsWith('https://')) rawUrl = 'https://' + rawUrl;
      const obj = existing || {createdAt:Date.now()}; obj.title = title; obj.username = document.getElementById('f-pwd-user').value.trim(); obj.password = pwd; obj.url = rawUrl; obj.notes = document.getElementById('f-pwd-notes').value.trim(); obj.category = document.getElementById('f-cat-input').dataset.val;
      if(existing) await dbPut('passwords', obj); else await dbAdd('passwords', obj); renderPasswords(); updateHomeStats(); toast('Salvo no cofre');
    }, onDelete: isEdit ? () => confirmDelete('passwords', existing.id, ()=>{renderPasswords();updateHomeStats();}) : null
  });
}

async function renderGallery() {
  const list = document.getElementById('gallery-list'); list.innerHTML = ''; let items = await dbAll('gallery');
  items.sort((a,b) => (b.createdAt||0) - (a.createdAt||0)); 
  if(!items.length){ list.appendChild(emptyState('🖼️','Galeria Vazia','Toque no + para guardar fotos ou vídeos', true)); return; }
  items.forEach(g => {
    const row = h('div', {class: 'gal-item', onclick: () => openGalleryViewer(g)});
    if (g.mediaType === 'video') { row.appendChild(h('video', {class: 'gal-thumb', src: g.mediaData, muted: true, autoplay: true, loop: true, playsinline: true})); } else { row.appendChild(h('img', {class: 'gal-thumb', src: g.mediaData})); }
    row.appendChild(h('div', {class: 'gal-info'}, g.title || 'Sem título')); list.appendChild(row);
  });
  if(window.aplicarLazyLoading) window.aplicarLazyLoading();
}
let tempMediaData = null; let tempMediaType = null;
function openGalleryForm() {
  tempMediaData = null; tempMediaType = null;
  openSheet({
    title: 'Adicionar à Galeria',
    buildFields: (box) => {
      const uploadBox = h('div', { style: 'width:100%; height:180px; background:var(--surface-2); border:2px dashed var(--line); border-radius:var(--r-md); display:flex; flex-direction:column; justify-content:center; align-items:center; color:var(--ink-soft); font-weight:600; font-size:14px; overflow:hidden; position:relative;', onclick: () => triggerGalleryUpload(uploadBox) });
      uploadBox.innerHTML = '<span style="font-size:32px; margin-bottom:8px;">📸</span> Toque para escolher foto/vídeo<br><span style="font-size:11px; font-weight:400; margin-top:6px;">Max: 15MB</span>';
      box.appendChild(fieldWrap('Mídia', uploadBox)); box.appendChild(fieldWrap('Descrição / Título', h('input',{type:'text', id:'f-gal-title', placeholder:'Ex: Documento, Placa...'})));
    },
    onSubmit: async () => {
      if (!tempMediaData) { toast('Escolha uma foto ou vídeo!'); return false; } const title = document.getElementById('f-gal-title').value.trim();
      toast('Salvando...'); const obj = { createdAt: Date.now(), title: title, mediaData: tempMediaData, mediaType: tempMediaType };
      await dbAdd('gallery', obj); renderGallery(); updateHomeStats(); toast('Salvo na galeria!');
    }
  });
}
function triggerGalleryUpload(boxEl) {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*, video/*';
  inp.onchange = e => {
    const f = e.target.files[0]; if(!f) return;
    if(f.size > 15 * 1024 * 1024) { alert('Arquivo muito grande! Máx 15MB.'); return; }
    const reader = new FileReader();
    reader.onload = ev => {
      tempMediaData = ev.target.result; tempMediaType = f.type.startsWith('video') ? 'video' : 'image'; boxEl.style.border = 'none';
      if (tempMediaType === 'video') { boxEl.innerHTML = `<video src="${tempMediaData}" style="width:100%; height:100%; object-fit:cover;" muted autoplay loop playsinline></video>`; } else { boxEl.innerHTML = `<img src="${tempMediaData}" style="width:100%; height:100%; object-fit:cover;">`; }
    }; reader.readAsDataURL(f);
  }; inp.click();
}
function openGalleryViewer(g) {
  const viewer = document.getElementById('media-viewer'); const content = document.getElementById('media-viewer-content');
  document.getElementById('media-viewer-title').textContent = g.title || 'Mídia Secreta'; content.innerHTML = '';
  if (g.mediaType === 'video') { content.appendChild(h('video', {src: g.mediaData, style: 'max-width:100%; max-height:80vh; border-radius:8px;', controls: true, autoplay: true, playsinline: true})); } else { content.appendChild(h('img', {src: g.mediaData, style: 'max-width:100%; max-height:80vh; border-radius:8px; object-fit:contain;'})); }
  const delBtn = document.getElementById('media-viewer-del');
  delBtn.onclick = () => { if(confirm('Excluir?')) { dbDel('gallery', g.id).then(() => { closeGalleryViewer(); renderGallery(); updateHomeStats(); toast('Excluído'); }); } };
  viewer.style.display = 'flex'; setTimeout(() => viewer.style.opacity = '1', 10);
}
function closeGalleryViewer() { const viewer = document.getElementById('media-viewer'); viewer.style.opacity = '0'; document.getElementById('media-viewer-content').innerHTML = ''; setTimeout(() => viewer.style.display = 'none', 200); }


/* ============================================================
   CRIPTOGRAFIA DE NÍVEL MILITAR (VAULT)
   ============================================================ */
const Vault = {
  async hashPwd(pwd) { const hash = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pwd)); return Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,'0')).join(''); },
  async deriveKey(pwd, salt) { const material = await crypto.subtle.importKey("raw", new TextEncoder().encode(pwd), "PBKDF2", false, ["deriveKey"]); return crypto.subtle.deriveKey({name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256"}, material, {name: "AES-GCM", length: 256}, false, ["encrypt", "decrypt"]); },
  async encryptItem(item, pwd) {
    if(item.isEncrypted) return item; 
    const salt = crypto.getRandomValues(new Uint8Array(16)); const iv = crypto.getRandomValues(new Uint8Array(12)); const key = await this.deriveKey(pwd, salt); const encoded = new TextEncoder().encode(JSON.stringify(item)); const encrypted = await crypto.subtle.encrypt({name: "AES-GCM", iv}, key, encoded);
    return { id: item.id, isEncrypted: true, salt: Array.from(salt), iv: Array.from(iv), data: Array.from(new Uint8Array(encrypted)) };
  },
  async decryptItem(encItem, pwd) {
    if(!encItem.isEncrypted) return encItem;
    try {
      const salt = new Uint8Array(encItem.salt); const iv = new Uint8Array(encItem.iv); const data = new Uint8Array(encItem.data); const key = await this.deriveKey(pwd, salt); const decrypted = await crypto.subtle.decrypt({name: "AES-GCM", iv}, key, data); const item = JSON.parse(new TextDecoder().decode(decrypted)); item.id = encItem.id; 
      return item;
    } catch(e) { throw new Error('Senha incorreta ou dados corrompidos'); }
  }
};
function promptMasterPassword(title, callback) {
  openSheet({
    title: title,
    buildFields: (box) => { box.appendChild(h('div', {style:'font-size:13px; color:var(--danger); font-weight:600; margin-bottom:12px; line-height:1.4;'}, 'Criptografia AES-256 ativa. Se você perder esta senha, NINGUÉM poderá recuperar seus dados.')); box.appendChild(fieldWrap('Senha Mestra', h('input', {type:'password', id:'f-master-pwd'}))); },
    submitLabel: 'Confirmar',
    onSubmit: async () => {
      const pwd = document.getElementById('f-master-pwd').value; if(!pwd) { toast('Digite a senha'); return false; }
      const savedHash = localStorage.getItem('master-hash'); const currentHash = await Vault.hashPwd(pwd);
      if (!savedHash) { if(!confirm('Esta será sua Senha Mestra permanente. Confirma?')) return false; localStorage.setItem('master-hash', currentHash); } else if (savedHash !== currentHash) { toast('Senha incorreta!'); return false; }
      closeSheet(); callback(pwd); return false;
    }
  });
}
function injectPadlocks() {
  const locked = JSON.parse(localStorage.getItem('locked-modules')||'[]');
  MODULES.forEach(m => {
    const header = document.getElementById(m.key + '-header');
    if (header && !header.querySelector('.lock-btn')) {
      const btn = h('button', { class: 'header-action lock-btn', id: 'lock-btn-' + m.key, style: 'margin-left: 8px; font-size: 16px;', onclick: () => toggleModuleLock(m.key) }, locked.includes(m.key) ? '🔒' : '🔓');
      header.appendChild(btn);
    }
  });
}
function toggleModuleLock(key) {
  const lockedArr = JSON.parse(localStorage.getItem('locked-modules')||'[]'); const isLocked = lockedArr.includes(key); const title = isLocked ? 'Destravar Módulo' : 'Criptografar Módulo';
  promptMasterPassword(title, async (pwd) => {
    toast('Processando...');
    try {
      const items = await dbAll(key);
      for (let item of items) { let processed = isLocked ? await Vault.decryptItem(item, pwd) : await Vault.encryptItem(item, pwd); await dbPut(key, processed); }
      let newArr = isLocked ? lockedArr.filter(k => k !== key) : [...lockedArr, key]; localStorage.setItem('locked-modules', JSON.stringify(newArr));
      document.getElementById('lock-btn-' + key).textContent = isLocked ? '🔓' : '🔒'; renderModule(key); toast(isLocked ? 'Destravado' : 'Travado 🔒'); updateHomeStats();
    } catch (e) { console.error(e); toast('Erro! Senha errada.'); }
  });
}

/* ============================================================
   LAZY LOADING
   ============================================================ */
window._lazyObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
        const el = entry.target;
        if (entry.isIntersecting) { el.classList.remove('lazy-hidden'); el.style.contentVisibility = 'visible'; } else {
            const rect = el.getBoundingClientRect(); if (rect.height > 0) { el.style.containIntrinsicSize = `auto ${Math.ceil(rect.height)}px`; el.style.contentVisibility = 'hidden'; }
            el.classList.add('lazy-hidden');
        }
    });
}, { rootMargin: '800px 0px 800px 0px' });
window.aplicarLazyLoading = () => { if (!window._lazyObserver) return; const seletores = '.item:not(.lazy-card), .gal-item:not(.lazy-card)'; document.querySelectorAll(seletores).forEach(el => { el.classList.add('lazy-card'); window._lazyObserver.observe(el); }); };

function updateHabitTimersUI() {
  const timers = document.querySelectorAll('.habit-timer'); if (!timers.length) return;
  const now = Date.now(); let needsRender = false; 
  timers.forEach(el => {
    const readyAt = parseInt(el.getAttribute('data-ready'), 10);
    if (readyAt > now) {
      const diff = Math.ceil((readyAt - now) / 1000); const h = Math.floor(diff / 3600); const m = Math.floor((diff % 3600) / 60); const s = diff % 60;
      let timeStr = pad(m) + ':' + pad(s); if (h > 0) timeStr = h + ':' + timeStr; el.textContent = '⏳ ' + timeStr;
    } else { needsRender = true; }
  });
  if (needsRender) renderHabits(); 
}
setInterval(updateHabitTimersUI, 1000);

function wireFilterTabs(){
  document.querySelectorAll('#screen-tasks .f-tab').forEach(btn=>{ btn.addEventListener('click', ()=>{ document.querySelectorAll('#screen-tasks .f-tab').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); taskFilter=btn.dataset.f; renderTasks(); }); });
}
